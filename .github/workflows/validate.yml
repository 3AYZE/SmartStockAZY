name: Validate SmartStockAZY

on:
  push:
    branches:
      - main
      - feature/opt-in-github-updates
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python and JavaScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -c "import ast; from pathlib import Path; [ast.parse(Path(p).read_text(encoding='utf-8')) for p in ('StonkResearch.pyw', 'update_support.py')]"
      - name: JavaScript syntax
        run: node --check app.js
      - name: JavaScript UI regression suite
        run: node --test tests/test_ui.js tests/test_update_ui.js

      - name: Install browser test driver (build-only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/smartstock-ui" --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency failed' }
      - name: Browser interaction and responsive layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SMARTSTOCK_PLAYWRIGHT_CORE = Join-Path $env:RUNNER_TEMP 'smartstock-ui/node_modules/playwright-core'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          )
          $env:SMARTSTOCK_BROWSER = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$env:SMARTSTOCK_BROWSER) { throw 'No browser available for UI test' }
          node --test tests/test_browser_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Browser UI tests failed' }
