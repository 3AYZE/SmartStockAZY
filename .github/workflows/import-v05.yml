name: Import SmartStockAZY v0.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v05.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.0 source update
        shell: bash
        run: |
          set -euo pipefail
          cat .v05-import/part* | base64 -d > /tmp/v05.patch.xz
          xz -dc /tmp/v05.patch.xz > /tmp/v05.patch
          git apply --check /tmp/v05.patch
          git apply /tmp/v05.patch
          rm -rf .v05-import .github/workflows/import-v05.yml
          git config user.name "Azy"
          git config user.email "126979239+3AYZE@users.noreply.github.com"
          git add -A
          git commit -m "Update SmartStockAZY to v0.5.0"
          git push
