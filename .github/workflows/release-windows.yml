name: Build & Release Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'StonkResearch.pyw'
      - 'update_support.py'
      - 'exe_updater.py'
      - 'app.js'
      - 'app.css'
      - 'index.html'
      - 'tools/create_windows_icon.py'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartstockazy-windows-exe-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js 22 for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify backend, updater and frontend
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python regression tests failed' }
          node --check app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
          node --test tests/test_ui.js tests/test_update_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript regression tests failed' }

      - name: Install free build-only tools
        shell: pwsh
        run: python -m pip install "pyinstaller>=6,<7" "pillow>=11,<13"

      - name: Prepare icon and embedded release identity
        shell: pwsh
        env:
          RELEASE_TAG: v0.6.${{ github.run_number }}
        run: |
          python tools/create_windows_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          $info = @{ tag = $env:RELEASE_TAG; sha = $env:GITHUB_SHA }
          $info | ConvertTo-Json -Compress | Set-Content -Path build_info.json -Encoding utf8

      - name: Package a single GUI executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --hidden-import exe_updater --name SmartStockAZY --icon "assets/SmartStockAZY.ico" --add-data "index.html;." --add-data "app.css;." --add-data "app.js;." --add-data "build_info.json;." StonkResearch.pyw
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (!(Test-Path "dist/SmartStockAZY.exe")) { throw 'Expected Windows EXE not found' }

      - name: Test the built EXE on Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/SmartStockAZY.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-browser' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              if ($proc.HasExited) { throw "Application exited unexpectedly with code $($proc.ExitCode)" }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($health.ok -eq $true -and $health.mode -eq 'windows-exe') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 800
            }
            if (!$ready) { throw 'Packaged EXE failed to start its localhost server' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 4
            $js = Invoke-WebRequest 'http://127.0.0.1:8765/app.js' -UseBasicParsing -TimeoutSec 4
            $css = Invoke-WebRequest 'http://127.0.0.1:8765/app.css' -UseBasicParsing -TimeoutSec 4
            $updates = Invoke-RestMethod 'http://127.0.0.1:8765/api/updates/status' -TimeoutSec 4
            if ($page.StatusCode -ne 200 -or $js.StatusCode -ne 200 -or $css.StatusCode -ne 200) { throw 'Embedded UI assets unavailable' }
            if (!$updates.installed_version) { throw 'Embedded EXE updater build identity missing' }
            Write-Output "EXE smoke test PASS: $($health.version) / embedded assets / updater"
          } finally {
            if (!$proc.HasExited) { taskkill /PID $proc.Id /T /F | Out-Null }
          }

      - name: Exercise packaged EXE replacement helper on Windows
        shell: pwsh
        env:
          RELEASE_TAG: v0.6.${{ github.run_number }}
        run: |
          $originalAppData = $env:LOCALAPPDATA
          $fixture = Join-Path $env:RUNNER_TEMP 'smartstock-update-smoke'
          $env:LOCALAPPDATA = Join-Path $fixture 'AppData'
          $appData = Join-Path $env:LOCALAPPDATA 'SmartStockAZY'
          $installed = Join-Path $fixture 'installed'
          $staged = Join-Path $fixture 'staged'
          $helper = Join-Path $fixture 'helper'
          New-Item -ItemType Directory -Force $appData,$installed,$staged,$helper | Out-Null
          $source = (Resolve-Path 'dist/SmartStockAZY.exe').Path
          $target = Join-Path $installed 'SmartStockAZY.exe'
          $payload = Join-Path $staged 'SmartStockAZY.exe'
          $runner = Join-Path $helper 'SmartStockAZY-Updater.exe'
          # Isolated fixture: old file differs from the verified replacement.
          Copy-Item $source $target
          Add-Content -Path $target -Value 'old fixture marker' -Encoding Ascii
          $oldHash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item $source $payload
          Copy-Item $source $runner
          $newHash = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          $db = Join-Path $appData 'stonk.db'
          $env:SMARTSTOCK_SMOKE_DB = $db
          python -c "import os,sqlite3; c=sqlite3.connect(os.environ['SMARTSTOCK_SMOKE_DB']); c.execute('create table smoke_marker(value text)'); c.execute('insert into smoke_marker values (?)',('preserve-me',)); c.commit(); c.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture DB setup failed' }
          $args = "--apply-exe-update ""$target"" ""$payload"" $newHash 0 $env:RELEASE_TAG"
          $proc = Start-Process -FilePath $runner -ArgumentList $args -PassThru
          try {
            if (!$proc.WaitForExit(65000)) { throw 'Packaged helper timed out' }
            $resultPath = Join-Path $appData 'exe-update-result.json'
            if (!(Test-Path $resultPath)) { throw 'No helper result written' }
            $result = Get-Content $resultPath -Raw | ConvertFrom-Json
            if (!$result.ok -or $result.tag -ne $env:RELEASE_TAG) { throw "Update helper failed: $($result.message)" }
            if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $newHash) { throw 'Installed binary hash mismatch' }
            $backup = Get-ChildItem (Join-Path $appData 'backups') -Filter '*.exe' | Select-Object -First 1
            if (!$backup -or (Get-FileHash $backup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $oldHash) { throw 'Old binary backup mismatch' }
            $health = Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 4
            if ($health.version -ne $env:RELEASE_TAG) { throw 'Replacement did not launch the expected build' }
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['SMARTSTOCK_SMOKE_DB']); assert c.execute('select value from smoke_marker').fetchone()==('preserve-me',); c.close()"
            if ($LASTEXITCODE -ne 0) { throw 'Local data was not preserved' }
            Write-Output 'Packaged replacement, backup, restart and SQLite preservation PASS'
          } finally {
            if (!$proc.HasExited) { taskkill /PID $proc.Id /T /F | Out-Null }
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $target } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            $env:LOCALAPPDATA = $originalAppData
          }

      - name: Write EXE SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/SmartStockAZY.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SmartStockAZY.exe" | Set-Content -Path "dist/SmartStockAZY.exe.sha256" -Encoding Ascii

      - name: Save downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStockAZY-Windows-EXE
          path: |
            dist/SmartStockAZY.exe
            dist/SmartStockAZY.exe.sha256
          if-no-files-found: error

      - name: Publish downloadable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v0.6.${{ github.run_number }}
        run: |
          gh release create "$env:RELEASE_TAG" "dist/SmartStockAZY.exe" "dist/SmartStockAZY.exe.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SmartStockAZY $env:RELEASE_TAG" --notes-file ".github/release-notes.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
