name: Import SmartStockAZY source

on:
  push:
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source package
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part_*.b64 | base64 --decode > /tmp/smartstock.zip
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          repo = Path.cwd()
          unpack = Path('/tmp/smartstock-unpack')
          if unpack.exists():
              shutil.rmtree(unpack)
          unpack.mkdir(parents=True)
          with zipfile.ZipFile('/tmp/smartstock.zip') as zf:
              zf.extractall(unpack)

          source = unpack / 'StonkResearchDesktop_v0.4.0_DecisionQuality'
          if not source.is_dir():
              raise SystemExit('Expected source folder was not found in archive')

          for item in source.iterdir():
              target = repo / item.name
              if target.exists():
                  if target.is_dir():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Commit imported v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          rm -f .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import SmartStockAZY v0.4.0 source"
            git push origin HEAD:main
          fi
